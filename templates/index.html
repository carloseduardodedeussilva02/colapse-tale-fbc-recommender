<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colapse!Tale</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--dim:#9a9a9a;--yel:#ff0;--red:#f00;--comum:#b5b5b5;--raro:#4aa3ff;--epico:#c46bff;--lendario:#ff9a1f;--suporte:#3dff8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:VT323,monospace;font-size:20px;max-width:1000px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
h1,h2{font-family:'Press Start 2P',monospace;font-weight:400}
h1{font-size:16px;color:var(--yel)}h2{font-size:11px;line-height:1.6;margin-bottom:8px}
.box{border:4px solid var(--fg);padding:10px}.box.turn{border-color:var(--yel)}
button{font:inherit;color:var(--fg);background:#000;border:4px solid var(--fg);padding:4px 12px;cursor:pointer}
button:hover:not(:disabled){color:var(--yel);border-color:var(--yel)}
button:disabled{color:#555;border-color:#555;cursor:default}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
select{font:inherit;background:#000;color:var(--fg);border:4px solid var(--fg);padding:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.cards{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.opps{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.opps .cards{grid-template-columns:repeat(4,1fr);gap:4px}
.card{position:relative;border:4px solid var(--c);padding:6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:17px;line-height:1.1}
.card .n{font-family:'Press Start 2P',monospace;font-size:8px;line-height:1.4}
.card.sel{outline:4px solid var(--yel);outline-offset:2px}
.card.dead{opacity:.25;filter:grayscale(1)}
.card .e{color:var(--dim);font-size:16px}.tag{font-size:15px;color:var(--c)}
.spr{width:56px;height:70px;image-rendering:pixelated}
.mini{padding:3px}.mini .spr{width:32px;height:40px}.mini .e,.mini .tag{display:none}.mini .n{font-size:6px}.mini .st{font-size:13px}
.hpbar{width:100%;height:10px;background:var(--red)}.hpbar i{display:block;height:100%;background:var(--yel)}
.st{display:flex;justify-content:space-around;width:100%}
#log{min-height:2.4em}
@keyframes ult{20%{transform:translateY(-16px) scale(1.3)}40%{transform:scale(1.1) rotate(-8deg)}60%{transform:translateY(-10px) rotate(8deg)}100%{transform:none}}
@keyframes ring{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(2.4)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes rise{to{transform:translateY(-28px);opacity:0}}
.ult .spr{animation:ult .9s steps(8)}
.ult::before{content:"";position:absolute;left:50%;top:30%;width:60px;height:60px;margin:-30px;border:4px solid var(--yel);border-radius:50%;animation:ring .9s steps(6) forwards;pointer-events:none}
.ult::after{content:"ULTIMATE!";position:absolute;top:-8px;left:0;right:0;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--yel);text-shadow:2px 2px var(--red)}
.hit{animation:shake .3s steps(4)}
.num{position:absolute;left:50%;top:20%;font-family:'Press Start 2P',monospace;font-size:11px;color:var(--red);animation:rise .9s steps(6) forwards;pointer-events:none}
@media(prefers-reduced-motion:reduce){.ult .spr,.hit,.ult::before,.num{animation:none}}
@media(max-width:760px){.opps{grid-template-columns:1fr}}

#bat{display:grid;gap:8px;grid-template-columns:140px 1fr 140px;grid-template-areas:". s2 ." "s1 mid s3" "me me me"}
#bat[hidden]{display:none}
#s1{grid-area:s1}#s2{grid-area:s2}#s3{grid-area:s3}#me{grid-area:me}
#mid{grid-area:mid;display:flex;flex-direction:column;gap:8px;justify-content:center}
.seat .cards{gap:4px}#s1 .cards,#s3 .cards{grid-template-columns:1fr}#s2 .cards{grid-template-columns:repeat(4,1fr)}
.stage{width:58px;height:66px;perspective:260px;zoom:var(--s,1);flex:none}.mini .stage{--s:.55}
.doll{position:relative;width:58px;height:66px;transform-style:preserve-3d;animation:sway 3s ease-in-out infinite alternate}
.cb{position:absolute;width:var(--w);height:var(--h);transform-style:preserve-3d}
.f{position:absolute;background:var(--k)}
.fr,.bk{width:var(--w);height:var(--h)}.fr{transform:translateZ(calc(var(--d)/2))}.bk{transform:rotateY(180deg) translateZ(calc(var(--d)/2))}
.rt,.lf{width:var(--d);height:var(--h);left:calc((var(--w) - var(--d))/2)}
.rt{transform:rotateY(90deg) translateZ(calc(var(--w)/2));filter:brightness(.8)}.lf{transform:rotateY(-90deg) translateZ(calc(var(--w)/2));filter:brightness(.7)}
.tp,.bt{width:var(--w);height:var(--d);top:calc((var(--h) - var(--d))/2)}
.tp{transform:rotateX(90deg) translateZ(calc(var(--h)/2));filter:brightness(1.1)}.bt{transform:rotateX(-90deg) translateZ(calc(var(--h)/2));filter:brightness(.5)}
.fa{background:radial-gradient(circle at 30% 50%,#111 2px,#0000 2.6px),radial-gradient(circle at 70% 50%,#111 2px,#0000 2.6px),linear-gradient(#0000 70%,#a44 70% 76%,#0000 76%),var(--k)}
.sk{background:radial-gradient(circle at 30% 45%,#000 3.5px,#0000 4px),radial-gradient(circle at 70% 45%,#000 3.5px,#0000 4px),linear-gradient(#0000 72%,#000 72% 78%,#0000 78%),var(--k)}
@keyframes sway{from{transform:rotateX(-8deg) rotateY(-32deg)}to{transform:rotateX(-8deg) rotateY(28deg)}}
@keyframes spin{to{transform:rotateX(-8deg) rotateY(720deg)}}
@keyframes jump{30%{transform:translateY(-18px) scale(1.25)}60%{transform:translateY(-8px)}100%{transform:none}}
@keyframes glow{50%{box-shadow:0 0 20px 5px var(--c)}}
@keyframes lunge{40%{transform:translateY(-14px) scale(1.08)}}
.ult .stage{animation:jump 1s}.ult .doll{animation:spin 1s ease-in-out}.ult{animation:glow 1s}.lunge{animation:lunge .5s steps(5)}
@media(prefers-reduced-motion:reduce){.doll,.ult .stage,.ult .doll,.ult,.lunge{animation:none}}
@media(max-width:760px){#bat{grid-template-columns:1fr;grid-template-areas:"s2" "s1" "s3" "mid" "me"}#s1 .cards,#s3 .cards{grid-template-columns:repeat(4,1fr)}}
.pt{width:84px;height:100px}.pt img{width:100%;height:100%;display:block;animation:bob 2.4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
@keyframes pjump{25%{transform:translateY(-22px) scale(1.25) rotate(-8deg)}55%{transform:translateY(-10px) scale(1.15) rotate(8deg);filter:drop-shadow(0 0 10px #ff0)}100%{transform:none}}
.ult .pt img{animation:pjump 1s}
@media(prefers-reduced-motion:reduce){.pt img,.ult .pt img{animation:none}}
.bench{opacity:.5}
.pt img{object-fit:contain}
input{font:inherit;background:#000;color:var(--fg);border:4px solid var(--fg);padding:4px;text-transform:uppercase}
input#nm{text-transform:none}
.pt{transform-style:preserve-3d;transition:transform .15s ease-out;transform:perspective(320px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.pt img{transform-origin:50% 100%;animation:breathe 2.8s ease-in-out infinite alternate}
.card:nth-child(2n) .pt img{animation-delay:-.7s}.card:nth-child(3n) .pt img{animation-delay:-1.4s}.card:nth-child(5n) .pt img{animation-delay:-2.1s}
@keyframes breathe{from{transform:scaleY(1)}to{transform:scaleY(1.035) scaleX(.985) translateY(-2px)}}
@keyframes bounce{to{transform:translateY(-8px) scale(1.06)}}
@keyframes wobble{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.card:hover .pt img{animation-duration:1.1s}
.card.sel .pt img{animation:bounce .6s ease-in-out infinite alternate}
.stunned .pt img{animation:wobble .5s linear infinite;filter:grayscale(.6) brightness(.8) sepia(.5) hue-rotate(170deg)}
.shielded .pt img{filter:drop-shadow(0 0 6px #4af) drop-shadow(0 0 2px #fff)}
.dead .pt img{animation:none;transform:rotate(78deg) translateY(14px) scale(.9);transition:transform .5s}
.hit .pt img{animation:none;filter:brightness(2) sepia(1) saturate(4) hue-rotate(-50deg)}
.mini .stage.pt{--s:1;width:56px;height:52px;overflow:hidden;perspective:none;transform:none}
.mini .pt img{width:128%;height:auto;max-width:none;margin-left:-14%;transform-origin:50% 30%}
@media(prefers-reduced-motion:reduce){.pt img,.card.sel .pt img,.stunned .pt img{animation:none}}
.sf{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;font-size:18px}
.sf span:nth-child(1){color:#6bdc6b}.sf span:nth-child(2){color:#5ab0ff}.sf span:nth-child(3){color:#ff6b6b}

.pt,.pt img{image-rendering:pixelated}
.pt{transform:none!important;transition:none}
.pt img{animation:bob8 1s linear infinite;filter:none}
@keyframes bob8{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-2px)}}
.card:nth-child(2n) .pt img{animation-delay:-.3s}.card:nth-child(3n) .pt img{animation-delay:-.6s}.card:nth-child(5n) .pt img{animation-delay:-.8s}
.card:hover .pt img{animation-duration:.5s}
@keyframes bounce8{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-6px)}}
.card.sel .pt img{animation:bounce8 .5s linear infinite}
@keyframes shake8{0%,49%{transform:translateX(-2px)}50%,100%{transform:translateX(2px)}}
.stunned .pt img{animation:shake8 .3s linear infinite;filter:grayscale(1) brightness(.9)}
.shielded .pt img{filter:drop-shadow(2px 0 0 #4af) drop-shadow(-2px 0 0 #4af) drop-shadow(0 2px 0 #4af) drop-shadow(0 -2px 0 #4af)}
.dead .pt img{animation:none;filter:grayscale(1);transform:translateY(14px) scaleY(.3)}
.hit .pt img{animation:none;filter:brightness(0) invert(1)}
@keyframes pjump8{0%{transform:translateY(0)}15%{transform:translateY(-24px)}30%{transform:translateY(0)}45%{transform:translateY(-14px)}60%{transform:translateY(0)}75%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.ult .pt img{animation:pjump8 .9s steps(1,end);filter:drop-shadow(2px 0 0 #ff0) drop-shadow(-2px 0 0 #ff0) drop-shadow(0 2px 0 #ff0) drop-shadow(0 -2px 0 #ff0)}
.ult .stage,.ult{animation:none}
.ult::before{border-radius:0;animation:ring .9s steps(5) forwards}
.hpbar i{background:repeating-linear-gradient(90deg,var(--yel) 0 4px,#b8b800 4px 5px)}
.mini .pt img{width:84px;height:100px;margin-left:-14px}

/* ---- sprites 8-bit: folha de 11 quadros de 24x32 (x3 = 72x96) ---- */
.spw{width:100%;height:100%;display:flex;justify-content:center;align-items:flex-end}
.spr{width:72px;height:96px;flex:none;background-repeat:no-repeat;background-size:792px 96px;background-position:0 0;image-rendering:pixelated;animation:idleF 2.4s steps(1,end) infinite}
.card:nth-child(2n):not(.ult):not(.happy):not(.sad) .spr{animation-delay:-.6s}
.card:nth-child(3n):not(.ult):not(.happy):not(.sad) .spr{animation-delay:-1.2s}
.card:nth-child(5n):not(.ult):not(.happy):not(.sad) .spr{animation-delay:-1.8s}
@keyframes idleF{0%{background-position-x:0}20%{background-position-x:-72px}40%{background-position-x:0}60%{background-position-x:-72px}80%{background-position-x:0}90%{background-position-x:-720px}95%{background-position-x:0}}
@keyframes ultF{0%{background-position-x:-144px}14%{background-position-x:-216px}30%{background-position-x:-288px}58%{background-position-x:-288px}72%{background-position-x:-360px}90%{background-position-x:0}}
@keyframes ultJ{0%,14%{transform:translateY(0)}30%{transform:translateY(-34px)}50%{transform:translateY(-44px)}72%,100%{transform:translateY(0)}}
@keyframes hapF{0%{background-position-x:-432px}25%{background-position-x:-504px}50%{background-position-x:-432px}75%{background-position-x:-504px}100%{background-position-x:0}}
@keyframes hop{0%{transform:translateY(0)}12%{transform:translateY(-9px)}25%{transform:translateY(0)}37%{transform:translateY(-9px)}50%{transform:translateY(0)}62%{transform:translateY(-9px)}75%,100%{transform:translateY(0)}}
@keyframes sadF{0%{background-position-x:-576px}35%{background-position-x:-648px}70%{background-position-x:-576px}100%{background-position-x:0}}
@keyframes sink{0%{transform:translateY(0)}50%{transform:translateY(3px)}100%{transform:translateY(0)}}
.ult .spr{animation:ultF .9s steps(1,end);filter:drop-shadow(2px 0 0 #ff0) drop-shadow(-2px 0 0 #ff0) drop-shadow(0 2px 0 #ff0) drop-shadow(0 -2px 0 #ff0)}
.ult .spw{animation:ultJ .9s steps(5,end)}
.happy .spr{animation:hapF 1.2s steps(1,end)}.happy .spw{animation:hop 1.2s steps(2,end)}
.sad .spr{animation:sadF 1.4s steps(1,end);filter:saturate(.35) brightness(.85)}.sad .spw{animation:sink 1.4s steps(2,end)}
.hit .spw{animation:shake8 .3s steps(1,end)}.hit .spr{filter:brightness(0) invert(1)}
.card.sel .spw{animation:bounce8 .5s linear infinite}
.stunned .spr{filter:grayscale(1)}.stunned .spw{animation:shake8 .3s linear infinite}
.shielded .spr{filter:drop-shadow(2px 0 0 #4af) drop-shadow(-2px 0 0 #4af) drop-shadow(0 2px 0 #4af) drop-shadow(0 -2px 0 #4af)}
.dead .spr{filter:grayscale(1);animation:none}.dead .spw{transform:translateY(20px) scaleY(.25)}
.mini .stage.pt{height:60px}.mini .spr{width:72px;height:96px}.mini .spw{align-items:flex-start}
@media(prefers-reduced-motion:reduce){.spr,.spw{animation:none!important}}
</style>
</head>

// [tipo, pele, cabelo, penteado, roupa, destaque, extras, olhos, traje, calça, sapato]
// tipo: h humano · sk caveira · ro robô | penteado: s curto, q topete, w ondulado, l longo, p rabo de cavalo

let G=[],cur=0,over=false,lock=false,S={};
const mk=(i,o,b=0)=>({i,o,b:b?1:0,hp:C[i][2],mhp:C[i][2],ar:C[i][3],at:C[i][4],stun:0,sh:0,sil:0,used:0,dead:0,sup:C[i][1]==='Suporte',rev:/^(Carlos|Ink Carlos)$/.test(C[i][0])?1:0});
function start(){G=[];const put=(l,o)=>{const cb=l.filter(i=>i<28);l.forEach(i=>G.push(mk(i,o,i<28&&cb.indexOf(i)>=3)))};
  for(let o=0;o<4;o++){if(PL[o].bot){const h=deal();put([...pick(h.slice(0,6),6),h[6]],o)}else put(DECK[o],o)}
  cur=0;over=false;lock=false;S={};$('prep').hidden=true;$('lobby').hidden=true;$('bat').hidden=false;render();beginPlayer()}
const alive=o=>G.some(c=>c.o===o&&!c.sup&&!c.dead);
const say=t=>$('log').textContent=t;
function cardHTML(c,id,cls,mini){const n=C[c.i][0],r=C[c.i][1],su=r==='Suporte';
  const st=[c.stun>0&&'imobilizado',c.sh>0&&'protegido',c.sil>0&&'silenciado',c.res>0&&'resistindo'].filter(Boolean).join(', ');
  return `<button class="card ${mini?'mini':''} ${cls} ${c.stun>0?'stunned':''} ${c.sh>0?'shielded':''}" style="--c:var(${COR[r]})" data-id="${id}" data-p="${id}">${sprite(n)}<span class="n">${n}</span>${c.full?`<span class="tag">${r}</span>`:''}
  ${su?'<span class="tag">Suporte · Ultimate de uso único</span>':`<div class="hpbar"><i style="width:${Math.max(0,c.hp/c.mhp*100)}%"></i></div>${c.full?`<div class="sf"><span>♥ HP ${c.hp}</span><span>◆ Armadura ${c.ar}</span><span>⚔ Dano ${c.at}</span></div>`:`<div class="st"><span>${Math.max(0,c.hp)}</span><span>◆${c.ar}</span><span>⚔${c.at}</span></div>`}`}
  <span class="e">${C[c.i][5]}</span><span class="tag">${st||(c.full?(c.lbl?c.lbl+' · ':'')+ultTag(c.i,0):c.lbl||(c.b?'Banco':c.used!==undefined?ultTag(c.i,c.used):r))}</span></button>`}
function render(){
  [[(ME+1)%4,'s1'],[(ME+2)%4,'s2'],[(ME+3)%4,'s3']].forEach(([o,id])=>{const e=$(id);e.className='box seat '+(cur===o&&!over?'turn':'');
    e.innerHTML=`<h2>${esc(PL[o].name)}${alive(o)?'':' (FORA)'}<br><small>banco: ${G.filter(c=>c.o===o&&c.b&&!c.dead).length}</small></h2><div class="cards">${G.map((c,i)=>c.o===o&&!c.b?cardHTML(c,i,c.dead?'dead':'',true):'').join('')}</div>`});
  $('me').className='box '+(cur===ME&&!over?'turn':'');
  $('me').innerHTML=`<h2>VOCÊ ${cur===ME&&!over?'— SUA VEZ':''}</h2><div class="cards">${G.map((c,id)=>c.o===ME?cardHTML(c,id,(c.dead?'dead ':'')+(S.me===id?'sel ':'')+(c.b?'bench':''),false):'').join('')}</div>`;
  const tot=G.filter(c=>c.o===ME&&!c.dead&&!c.sup&&!c.stun&&!c.b).reduce((t,c)=>t+c.at,0),m=G[S.me],ok=!over&&cur===ME&&!lock;
  const can=ok&&m&&!m.dead&&(m.sup||m.stun===0)&&U[C[m.i][0]]&&!m.used&&m.sil===0;
  $('acts').innerHTML=`<button id="bUlt" ${can?'':'disabled'}>Usar Ultimate</button><button id="bAtk" ${ok&&tot>0?'':'disabled'}>Atacar com tudo (${tot})</button>${over?'<button id="bAgain">Jogar de novo</button>':''}`;queueSync()}
function fx(id,cls,txt){if(MP&&IS_HOST)FXQ.push([id,cls,txt]);const el=document.querySelector(`#bat [data-id="${id}"]`);if(!el)return;el.classList.add(cls);if(txt!==undefined){const s=document.createElement('span');s.className='num';s.textContent=txt;el.appendChild(s)}}
let AUTO=[];
function hit(t,d){if(t.sh>0||t.res>0)return 0;const a=Math.min(t.ar,d);t.ar-=a;t.hp-=d-a;if(t.hp<=0)fall(t);return d}
// carta ficou sem HP: dispara a Ultimate fora de turno (se tiver) e, se ela não salvar a carta, a carta cai
function fall(t){const n=C[t.i][0];
  if(t.rev){t.rev=0;t.used=1;t.hp=Math.round(t.mhp/2);t.ar=Math.round(C[t.i][3]/2);if(n==='Ink Carlos')t.at=Math.round(t.at*1.1);AUTO.push([t,`${n} renasceu!`]);return}
  if(n==='Vitória'&&!t.used){t.used=1;t.hp=0;t.res=1;AUTO.push([t,`${n} resiste por mais uma rodada!`]);return}
  if(n==='Beatriz'&&!t.used){const nb=G.find(x=>x.o===t.o&&x.b&&!x.dead);if(nb){t.used=1;t.hp=t.mhp;t.b=1;nb.b=0;AUTO.push([t,`${n} trocou de lugar com ${C[nb.i][0]} e recuperou o HP!`]);return}}
  die(t)}
function die(t){const n=C[t.i][0];t.hp=0;t.dead=1;t.res=0;
  if(n==='Peter'&&!t.used){t.used=1;const al=G.filter(x=>x.o===t.o&&!x.sup&&!x.dead&&!x.b&&x!==t).sort((p,q)=>q.at-p.at)[0];
    if(al){const g=Math.round(t.at*.5);al.at+=g;AUTO.push([t,`${n} passou ${g} de dano para ${C[al.i][0]}!`,al])}}
  const nb=G.find(x=>x.o===t.o&&x.b&&!x.dead);if(nb)nb.b=0;
  const rg={Marcos:[0,10],Lyra:[18,24],'Ink Sans':[0,28]}[n];
  if(rg&&!t.used){t.used=1;const own=G.filter(x=>x.o===t.o).map(x=>x.i),pool=rng(...rg).filter(i=>!own.includes(i)),i=pick(pool.length?pool:rng(...rg),1)[0],mesa=G.filter(x=>x.o===t.o&&!x.sup&&!x.dead&&!x.b).length;
    G.push(mk(i,t.o,mesa>=3));AUTO.push([t,`${n} chamou ${C[i][0]} para o jogo!`])}}
function ultimate(me,t){const[k,w,a,b]=U[C[me.i][0]].split(':'),al=G.filter(x=>x.o===me.o&&!x.dead&&!x.sup&&!x.b),en=G.filter(x=>x.o!==me.o&&!x.dead&&!x.sup&&!x.b);
  let L;
  if(w==='self')L=[me];else if(w==='ally'||w==='e1')L=[t];else if(w==='selfally')L=[me,t];
  else if(w==='self2')L=[me,...pick(al.filter(x=>x!==me),2)];else if(w==='all')L=al;
  else if(w==='e2')L=[t,...pick(en.filter(x=>x!==t),1)];else if(w==='low')L=[[...en].sort((x,y)=>x.hp-y.hp)[0]];
  else if(w==='low50')L=al.filter(x=>x.hp<x.mhp/2).slice(0,1);
  L=[...new Set(L)].filter(Boolean);if(!L.length)return null;
  L.forEach(x=>{const m=1+b/100;
    if(k==='buff'){x[a]=Math.round(x[a]*m);if(a==='hp')x.mhp=Math.round(x.mhp*m)}
    else if(k==='deb'){(a==='both'?['ar','at']:[a]).forEach(s=>x[s]=Math.round(x[s]*(1-b/100)))}
    else if(k==='stun')x.stun=+a;else if(k==='sil')x.sil=+a;else if(k==='shield')x.sh=+a+1;
    else if(k==='dbl'){x.hp*=2;x.mhp*=2;x.ar*=2;x.at*=2}else if(k==='min'){const q=['at','ar','hp'].reduce((m,z)=>x[z]<x[m]?z:m,'at');x[q]+=+a;if(q==='hp')x.mhp+=+a}else if(k==='heal')x.hp=x.mhp;else if(k==='rev'){x.dead=0;x.hp=Math.round(x.mhp/2);x.b=G.filter(y=>y.o===x.o&&!y.sup&&!y.dead&&!y.b&&y!==x).length>=3?1:0}});
  me.used=1;return L}
let aiN=0;
function doUlt(me,tgt,then){lock=true;const L=ultimate(me,tgt);
  if(!L){lock=false;say('A Ultimate não encontrou alvo válido.');render();return then&&then(true)}
  S={};say(`${C[me.i][0]} usou a Ultimate!`);render();fx(G.indexOf(me),'ult');{const k0=U[C[me.i][0]].split(':')[0],bom=['buff','shield','heal','rev','dbl','min'].includes(k0);L.forEach(x=>{if(x!==me)fx(G.indexOf(x),bom?'happy':'sad')})};
  setTimeout(()=>{lock=false;render();then&&then()},1200)}
function doAttack(tgt){lock=true;const at=G.filter(c=>c.o===cur&&!c.dead&&!c.sup&&!c.stun&&!c.b),d=hit(tgt,at.reduce((t,c)=>t+c.at,0)),au=AUTO.splice(0);
  S={};say(`${PL[cur].name} atacou ${C[tgt.i][0]} com ${at.length} carta(s): ${d?'-'+d:'protegido!'}`+au.map(a=>' · '+a[1]).join(''));render();
  at.forEach(c=>fx(G.indexOf(c),'lunge'));fx(G.indexOf(tgt),'hit',d?'-'+d:'0');au.forEach(a=>{fx(G.indexOf(a[0]),'ult');if(a[2])fx(G.indexOf(a[2]),'happy')});setTimeout(endTurn,1300)}
function beginPlayer(){const p=G.some(c=>c.o===cur&&!c.dead&&!c.sup&&!c.stun&&!c.b);
  say(p?(cur===ME?'Sua vez. Use Ultimates (quantas quiser) e depois ataque.':`Vez de ${PL[cur].name}.`):`${PL[cur].name} está com as cartas imobilizadas. Turno pulado.`);
  if(!p)setTimeout(endTurn,1300);render()}
function endTurn(){G.filter(c=>c.o===cur).forEach(c=>{c.stun=Math.max(0,c.stun-1);c.sh=Math.max(0,c.sh-1);c.sil=Math.max(0,c.sil-1);if(c.res>0&&--c.res===0)die(c)});aiN=0;
  const v=[0,1,2,3].filter(alive);
  if(v.length<2){over=true;lock=false;say(`${PL[v[0]].name} VENCEU! Último com cartas na mesa.`);return render()}
  do cur=(cur+1)%4;while(!alive(cur));lock=false;render();AUTO.splice(0).forEach(a=>{fx(G.indexOf(a[0]),'ult');if(a[2])fx(G.indexOf(a[2]),'happy')});
  PL[cur].bot?setTimeout(ai,1000):beginPlayer()}
function ai(){const mine=G.filter(c=>c.o===cur&&!c.dead&&!c.b),en=G.filter(c=>c.o!==cur&&!c.dead&&!c.sup&&!c.b),atk=()=>doAttack(pick(en,1)[0]);
  if(!mine.some(c=>!c.sup&&!c.stun)){say(`${PL[cur].name} está imobilizado e passou a vez.`);return setTimeout(endTurn,1000)}
  const us=mine.filter(c=>U[C[c.i][0]]&&!c.used&&!c.sil&&(c.sup||!c.stun));
  if(aiN<2&&us.length&&Math.random()<.5){aiN++;const m=pick(us,1)[0],[k,w]=U[C[m.i][0]].split(':');
    const pool=G.filter(c=>c.o===cur&&!c.sup&&!c.b&&(k==='rev'?c.dead:!c.dead)),t=w[0]==='e'?pick(en,1)[0]:pick(pool,1)[0];
    if(!(['e1','e2','ally','selfally'].includes(w)&&!t))return doUlt(m,t,f=>f?atk():setTimeout(ai,500))}
  atk()}
$('bat').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='bAgain')return location.reload();
  if(over||cur!==ME||lock)return;
  const me=G[S.me];
  if(b.id==='bAtk'){S.mode='atk';return say('Escolha a carta inimiga que receberá o ataque total.')}
  if(b.id==='bUlt'){const w=U[C[me.i][0]].split(':')[1];
    if(['e1','e2','ally','selfally'].includes(w)){S.mode='ult';return say(w[0]==='e'?'Escolha o alvo inimigo da Ultimate.':'Escolha a carta aliada alvo da Ultimate.')}
    return req('u',me,null)}
  const id=b.dataset.id;if(id===undefined)return;const c=G[+id];
  if(S.mode==='atk'&&c.o!==ME){return c.dead||c.sup||c.b?0:req('a',null,c)}
  if(S.mode==='ult'){const sp=U[C[me.i][0]].split(':'),w=sp[1],ok=w[0]==='e'?c.o!==ME&&!c.dead&&!c.sup&&!c.b:c.o===ME&&!c.sup&&!c.b&&(sp[0]==='rev'?c.dead:!c.dead);
    return ok?req('u',me,c):0}
  if(c.o===ME&&!c.dead&&!c.b){S={me:+id};say(`${C[c.i][0]} selecionada.`);render()}};
// ---------- multijogador (mesma rede Wi-Fi) ----------
// O navegador de quem criou a sala é o "anfitrião": roda as regras e envia o estado aos outros pelo servidor (app.py).
let ME=0,IS_HOST=true,MP=false,WS=null,CODE='',nome='Jogador',names={},DECK={},RDY={},FXQ=[],syncT=0;
let PL=[{name:'Você',bot:0},{name:'Bot 2',bot:1},{name:'Bot 3',bot:1},{name:'Bot 4',bot:1}];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const send=o=>{if(WS&&WS.readyState===1)WS.send(JSON.stringify(o))};
function queueSync(){if(MP&&IS_HOST&&!syncT)syncT=setTimeout(flush,0)}
function view(s){return G.map(c=>c.o!==s&&c.b?{o:c.o,b:1,i:-1,dead:c.dead,sup:c.sup,hp:0,mhp:1,ar:0,at:0,stun:0,sh:0,sil:0,used:0}:c)}
function flush(){syncT=0;const fx=FXQ;FXQ=[];for(let s=1;s<4;s++)if(!PL[s].bot)send({t:'toSeat',seat:s,m:{t:'state',G:view(s),cur,over,lock,log:$('log').textContent,fx,PL}})}
function req(t,me,c){S={};if(IS_HOST){t==='u'?doUlt(me,c):doAttack(c)}else{lock=true;send({t:'toHost',m:{k:t,me:me?G.indexOf(me):-1,c:c?G.indexOf(c):-1}})}}
function onAct(seat,m){
  if(m.k==='ready'){if(!Array.isArray(m.deck)||m.deck.length<6||m.deck.length>7||m.deck.some(i=>!(i>=0&&i<33)))return;DECK[seat]=m.deck;RDY[seat]=1;return tryStart()}
  if(!G.length||over||cur!==seat||lock)return;
  const me=G[m.me],t=G[m.c];
  if(m.k==='u'){if(!me||me.o!==seat||!U[C[me.i][0]]||me.used||me.sil>0||me.dead||me.b||(!me.sup&&me.stun>0))return;doUlt(me,t||null)}
  else if(t&&t.o!==seat&&!t.dead&&!t.sup&&!t.b)doAttack(t)}
function onState(m){G=m.G;cur=m.cur;over=m.over;lock=m.lock;PL=m.PL;
  if(cur!==ME||lock)S={};else if(S.me!==undefined&&(!G[S.me]||G[S.me].dead||G[S.me].b||G[S.me].o!==ME))S={};
  $('lobby').hidden=true;$('prep').hidden=true;$('bat').hidden=false;render();$('log').textContent=m.log;m.fx.forEach(f=>fx(...f))}
function ready(){const deck=[...chosen];
  if(IS_HOST){DECK[0]=deck;RDY[0]=1;prep('Aguardando os outros jogadores...');tryStart()}
  else{send({t:'toHost',m:{k:'ready',deck}});prep('Pronto! Aguardando os outros jogadores...')}}
function tryStart(){if(!RDY[0])return;for(let s=1;s<4;s++)if(!PL[s].bot&&!RDY[s])return;start()}
function goPrep(){$('lobby').hidden=true;$('prep').hidden=false;prep()}
function conn(cb){try{WS=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws')}catch(e){return lobDraw('Servidor indisponível nesta página. Abra o jogo pelo endereço do app.py.')}
  WS.onopen=cb;WS.onmessage=e=>onMsg(JSON.parse(e.data));WS.onerror=()=>lobDraw('Não consegui conectar. Abra esta página pelo endereço mostrado ao rodar o app.py.')}
function onMsg(m){
  if(m.t==='joined'){MP=true;ME=m.seat;IS_HOST=m.seat===0;CODE=m.code;names=m.names;lobDraw()}
  else if(m.t==='lobby'){names=m.names;lobDraw()}
  else if(m.t==='err')lobDraw(m.msg)
  else if(m.t==='prep'){PL=m.PL;goPrep()}
  else if(m.t==='state')onState(m)
  else if(m.t==='act')onAct(m.seat,m.m)
  else if(m.t==='left'){PL[m.seat]={name:PL[m.seat].name+' (bot)',bot:1};if(!G.length){if(RDY[0])tryStart()}else if(cur===m.seat&&!lock)setTimeout(ai,800)}
  else if(m.t==='closed')document.body.insertAdjacentHTML('afterbegin','<div class="box bad">O anfitrião saiu. Recarregue a página.</div>')}
function lobDraw(msg){const el=$('lobby');
  el.innerHTML=!CODE?`<h2>JOGAR</h2><p>Seu nome: <input id="nm" maxlength="12" value="${esc(nome)}"></p>
  <div class="row"><button id="bSolo">Jogar solo (3 bots)</button><button id="bCria">Criar sala (Wi-Fi)</button><input id="cd" maxlength="4" placeholder="CÓDIGO" size="6"><button id="bEntra">Entrar</button></div><p>${msg||''}</p>`
  :`<h2>SALA ${esc(CODE)}</h2><p>Os amigos abrem o mesmo endereço do servidor e entram com este código. Vagas vazias viram bots.</p>
  <p>${[0,1,2,3].map(s=>`${s+1}. ${names[s]?esc(names[s]):'(bot)'}`).join('<br>')}</p>${IS_HOST?'<button id="bGoPrep">Iniciar preparação</button>':'<p>Aguardando o anfitrião...</p>'}<p>${msg||''}</p>`}
$('lobby').onclick=e=>{const b=e.target.closest('button');if(!b)return;const f=$('nm');if(f)nome=f.value.trim()||'Jogador';
  if(b.id==='bSolo'){PL[0].name=nome;MP=false;goPrep()}
  if(b.id==='bCria')conn(()=>send({t:'create',name:nome}));
  if(b.id==='bEntra')conn(()=>send({t:'join',name:nome,code:$('cd').value}));
  if(b.id==='bGoPrep'){PL=[0,1,2,3].map(s=>({name:names[s]||'Bot '+(s+1),bot:names[s]?0:1}));send({t:'toAll',m:{t:'prep',PL}});goPrep()}};
// inclinação 3D das cartas seguindo o dedo/mouse
document.addEventListener('pointermove',e=>{
  document.querySelectorAll('.tilt').forEach(x=>{if(!x.contains(e.target)){x.classList.remove('tilt');const q=x.querySelector('.pt');if(q){q.style.removeProperty('--rx');q.style.removeProperty('--ry')}}});
  const c=e.target.closest&&e.target.closest('.card');if(!c||c.classList.contains('mini'))return;const q=c.querySelector('.pt');if(!q)return;
  const r=c.getBoundingClientRect();c.classList.add('tilt');q.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*28+'deg');q.style.setProperty('--rx',(.5-(e.clientY-r.top)/r.height)*18+'deg')});

try{makePortraits()}catch(e){}
lobDraw();
</script>
